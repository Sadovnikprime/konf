<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Регистрация — Конференции.РФ</title>
  <link rel="stylesheet" href="/lib/bootstrap.min.css">
  <link rel="stylesheet" href="/lib/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="bg-light">
  <header class="bg-primary">
    <div class="container d-flex flex-wrap justify-content-between align-items-center py-2">
      <a class="navbar-brand text-white fw-bold fs-4" href="/"><i class="bi bi-easel"></i> Конференции.РФ</a>
      <nav class="nav">
        <a class="nav-link text-white" href="/login.html">Вход</a>
        <a class="nav-link text-white" href="/register.html">Регистрация</a>
      </nav>
    </div>
  </header>

  <main class="container py-4">
    <h1 class="h3 mb-3">Регистрация</h1>

    <form class="card card-body shadow-sm form-box" id="form" novalidate>
      <div class="mb-3">
        <label class="form-label" for="login">Логин</label>
        <input class="form-control" id="login" name="login" type="text">
        <div class="form-text">Латинские буквы и цифры, не меньше 6 символов</div>
        <div class="invalid-feedback"></div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="password">Пароль</label>
        <input class="form-control" id="password" name="password" type="password">
        <div class="form-text">Не меньше 8 символов</div>
        <div class="invalid-feedback"></div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="fullName">ФИО</label>
        <input class="form-control" id="fullName" name="fullName" type="text">
        <div class="form-text">Русскими буквами</div>
        <div class="invalid-feedback"></div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="phone">Телефон</label>
        <input class="form-control" id="phone" name="phone" type="tel" placeholder="8(999)123-45-67">
        <div class="form-text">Формат: 8(XXX)XXX-XX-XX</div>
        <div class="invalid-feedback"></div>
      </div>

      <div class="mb-3">
        <label class="form-label" for="email">Электронная почта</label>
        <input class="form-control" id="email" name="email" type="email" placeholder="name@example.ru">
        <div class="invalid-feedback"></div>
      </div>

      <button class="btn btn-primary" type="submit">Зарегистрироваться</button>
      <p class="mt-3 mb-0">Уже зарегистрированы? <a href="/login.html">Вход</a></p>
    </form>
  </main>

  <footer class="border-top py-3 text-secondary small">
    <div class="container">Конференции.РФ — бронирование помещений для конференций</div>
  </footer>

  <script src="/script.js"></script>
  <script>
    const form = document.getElementById('form');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const data = Object.fromEntries(new FormData(form));
      const result = await api('POST', '/api/register', data);

      if (result.ok) {
        location.href = '/login.html?registered';
      } else {
        showErrors(form, result.errors);
      }
    });
  </script>
</body>
</html>
