<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Мои заявки — Конференции.РФ</title>
  <link rel="stylesheet" href="/lib/bootstrap.min.css">
  <link rel="stylesheet" href="/lib/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="bg-light">
  <header class="bg-primary">
    <div class="container d-flex flex-wrap justify-content-between align-items-center py-2">
      <a class="navbar-brand text-white fw-bold fs-4" href="/bookings.html"><i class="bi bi-easel"></i> Конференции.РФ</a>
      <nav class="nav">
        <a class="nav-link text-white" href="/bookings.html">Мои заявки</a>
        <a class="nav-link text-white" href="/booking-new.html">Новая заявка</a>
        <a class="nav-link text-white" href="/logout"><i class="bi bi-box-arrow-right"></i> Выйти</a>
      </nav>
    </div>
  </header>

  <main class="container py-4">
    <div class="alert alert-success" id="message" hidden></div>
    <h1 class="h3 mb-3">Мои заявки</h1>
    <a class="btn btn-primary mb-3" href="/booking-new.html"><i class="bi bi-plus-lg"></i> Новая заявка</a>

    <!-- Сюда скрипт добавляет карточки заявок -->
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3" id="list"></div>
  </main>

  <footer class="border-top py-3 text-secondary small">
    <div class="container">Конференции.РФ — бронирование помещений для конференций</div>
  </footer>

  <script src="/script.js"></script>
  <script>
    const list = document.getElementById('list');

    // Загружает заявки с сервера и рисует карточки
    async function loadBookings() {
      const bookings = await api('GET', '/api/bookings');

      if (bookings.length === 0) {
        list.innerHTML = '<p class="text-secondary">У вас пока нет заявок.</p>';
      } else {
        list.innerHTML = bookings.map(makeCard).join('');
      }
    }

    // Возвращает HTML одной карточки заявки
    function makeCard(booking) {
      return `
        <div class="col">
          <div class="card h-100 card-hover">
            <div class="card-body">
              <div class="d-flex align-items-center gap-3 mb-2">
                <img class="room-image border rounded" src="/img/${booking.room_image}" alt="">
                <h2 class="h5 mb-0">${booking.room_name}</h2>
              </div>
              <span class="badge rounded-pill ${statusColor(booking.status)}">${booking.status}</span>
              <p class="mt-2 mb-1"><i class="bi bi-calendar-event text-primary"></i> ${booking.start_at}</p>
              <p class="mb-0"><i class="bi bi-credit-card text-primary"></i> ${booking.payment}</p>
            </div>
            <div class="card-footer bg-white">${makeReview(booking)}</div>
          </div>
        </div>`;
    }

    // Нижняя часть карточки: готовый отзыв, форма отзыва или подсказка
    function makeReview(booking) {
      // Отзыв уже оставлен
      if (booking.review_rating) {
        return `
          <p class="mb-1"><b>Ваш отзыв:</b> <span class="text-warning">${'<i class="bi bi-star-fill"></i>'.repeat(booking.review_rating)}</span></p>
          <p class="mb-0">${safe(booking.review_text)}</p>`;
      }

      // Отзыв доступен только после завершения мероприятия
      if (booking.status !== 'Завершено') {
        return '<small class="text-secondary">Отзыв можно оставить после завершения мероприятия.</small>';
      }

      return `
        <details>
          <summary class="text-primary fw-semibold">Оставить отзыв</summary>
          <form class="mt-2" novalidate onsubmit="sendReview(event, ${booking.id})">
            <div class="mb-2">
              <label class="form-label" for="rating${booking.id}">Оценка</label>
              <select class="form-select" id="rating${booking.id}" name="rating">
                <option value="">Выберите оценку</option>
                <option value="5">5 — отлично</option>
                <option value="4">4 — хорошо</option>
                <option value="3">3 — нормально</option>
                <option value="2">2 — плохо</option>
                <option value="1">1 — очень плохо</option>
              </select>
              <div class="invalid-feedback"></div>
            </div>
            <div class="mb-2">
              <label class="form-label" for="text${booking.id}">Отзыв</label>
              <textarea class="form-control" id="text${booking.id}" name="text" rows="3"></textarea>
              <div class="invalid-feedback"></div>
            </div>
            <button class="btn btn-primary" type="submit">Отправить отзыв</button>
          </form>
        </details>`;
    }

    // Отправляет отзыв на сервер
    async function sendReview(event, bookingId) {
      event.preventDefault();
      const form = event.target;

      const data = Object.fromEntries(new FormData(form));
      const result = await api('POST', '/api/bookings/' + bookingId + '/review', data);

      if (result.ok) {
        showMessage('Спасибо за отзыв!');
        loadBookings(); // обновляем список, чтобы отзыв появился в карточке
      } else {
        showErrors(form, result.errors);
      }
    }

    loadBookings();
  </script>
</body>
</html>
