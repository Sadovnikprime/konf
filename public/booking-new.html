<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Новая заявка — Конференции.РФ</title>
  <link rel="stylesheet" href="/lib/bootstrap.min.css">
  <link rel="stylesheet" href="/lib/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="bg-light">
  <header class="bg-primary">
    <div class="container d-flex flex-wrap justify-content-between align-items-center py-2">
      <a class="navbar-brand text-white fw-bold fs-4" href="/bookings.html"><i class="bi bi-easel"></i> Конференции.РФ</a>
      <nav class="nav">
        <a class="nav-link text-white" href="/bookings.html">Мои заявки</a>
        <a class="nav-link text-white" href="/booking-new.html">Новая заявка</a>
        <a class="nav-link text-white" href="/logout"><i class="bi bi-box-arrow-right"></i> Выйти</a>
      </nav>
    </div>
  </header>

  <main class="container py-4">
    <h1 class="h3 mb-3">Новая заявка</h1>

    <div class="row g-4">
      <div class="col-md-6">
        <form class="card card-body shadow-sm form-box" id="form" novalidate>
          <div class="mb-3">
            <label class="form-label" for="roomId">Помещение</label>
            <!-- Список помещений загружается с сервера -->
            <select class="form-select" id="roomId" name="roomId">
              <option value="">Выберите помещение</option>
            </select>
            <div class="invalid-feedback"></div>
          </div>

          <div class="mb-3">
            <label class="form-label" for="startAt">Дата и время начала</label>
            <input class="form-control" id="startAt" name="startAt" type="datetime-local">
            <div class="invalid-feedback"></div>
          </div>

          <div class="mb-3">
            <label class="form-label" for="payment">Способ оплаты</label>
            <select class="form-select" id="payment" name="payment">
              <option value="">Выберите способ оплаты</option>
              <option>При очном посещении</option>
              <option>Переводом по СБП</option>
            </select>
            <div class="invalid-feedback"></div>
          </div>

          <button class="btn btn-primary" type="submit"><i class="bi bi-send"></i> Отправить</button>
        </form>
      </div>

      <!-- Картинка и описание выбранного помещения -->
      <div class="col-md-6">
        <div class="card shadow-sm" id="preview" hidden>
          <img class="card-img-top p-3" id="room-image" alt="Схема зала">
          <div class="card-body pt-0">
            <p class="mb-0" id="room-text"></p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="border-top py-3 text-secondary small">
    <div class="container">Конференции.РФ — бронирование помещений для конференций</div>
  </footer>

  <script src="/script.js"></script>
  <script>
    const form = document.getElementById('form');
    const roomSelect = document.getElementById('roomId');
    const preview = document.getElementById('preview');
    let rooms = [];

    // Загружает помещения и добавляет их в выпадающий список
    async function loadRooms() {
      rooms = await api('GET', '/api/rooms');
      rooms.forEach((room) => {
        roomSelect.innerHTML += `<option value="${room.id}">${room.name}</option>`;
      });
    }

    // При выборе помещения показывает его картинку и описание
    roomSelect.addEventListener('change', () => {
      const room = rooms.find((item) => item.id === Number(roomSelect.value));

      preview.hidden = !room;
      if (room) {
        document.getElementById('room-image').src = '/img/' + room.image;
        document.getElementById('room-text').textContent = room.description + ' До ' + room.capacity + ' мест.';
      }
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      const data = Object.fromEntries(new FormData(form));
      const result = await api('POST', '/api/bookings', data);

      if (result.ok) {
        location.href = '/bookings.html'; // заявка создана — переходим к списку заявок
      } else {
        showErrors(form, result.errors);
      }
    });

    loadRooms();
  </script>
</body>
</html>
