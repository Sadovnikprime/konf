<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Панель администратора — Конференции.РФ</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <a class="logo" href="/admin.html">Конференции.РФ</a>
      <nav class="nav">
        <a href="/admin.html">Заявки</a>
        <a href="/logout">Выйти</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <p class="message" id="message" hidden></p>
    <h1>Панель администратора</h1>

    <!-- Фильтр: при выборе значения список заявок загружается заново -->
    <div class="filter">
      <select id="status" aria-label="Статус" onchange="loadBookings()">
        <option value="">Все статусы</option>
        <option>Новая</option>
        <option>Мероприятие назначено</option>
        <option>Завершено</option>
      </select>

      <select id="room" aria-label="Помещение" onchange="loadBookings()">
        <option value="">Все помещения</option>
      </select>
    </div>

    <p id="count"></p>

    <!-- Сюда скрипт добавляет карточки заявок -->
    <div class="cards" id="list"></div>
  </main>

  <footer class="footer">
    <div class="container">Конференции.РФ — бронирование помещений для конференций</div>
  </footer>

  <script src="/script.js"></script>
  <script>
    const statusSelect = document.getElementById('status');
    const roomSelect = document.getElementById('room');

    // Загружает помещения в выпадающий список фильтра
    async function loadRooms() {
      const rooms = await api('GET', '/api/rooms');
      rooms.forEach((room) => {
        roomSelect.innerHTML += `<option value="${room.id}">${room.name}</option>`;
      });
    }

    // Загружает заявки с учётом фильтра и рисует карточки
    async function loadBookings() {
      const url = '/api/admin/bookings?status=' + encodeURIComponent(statusSelect.value) + '&room=' + roomSelect.value;
      const bookings = await api('GET', url);

      document.getElementById('count').textContent = 'Найдено заявок: ' + bookings.length;
      document.getElementById('list').innerHTML = bookings.map(makeCard).join('');
    }

    // Возвращает HTML одной карточки заявки
    function makeCard(booking) {
      return `
        <article class="card">
          <div class="card-head">
            <img src="/img/${booking.room_image}" alt="">
            <h2>№ ${booking.id}. ${booking.room_name}</h2>
          </div>
          <p><span class="badge" data-status="${booking.status}">${booking.status}</span></p>
          <p>📅 ${booking.start_at}</p>
          <p>💳 ${booking.payment}</p>
          <p>👤 ${safe(booking.user_name)}</p>
          <p>📞 ${safe(booking.user_phone)}</p>
          <p>✉️ ${safe(booking.user_email)}</p>
          ${makeReview(booking)}
          ${makeButtons(booking)}
        </article>`;
    }

    // Отзыв пользователя, если он есть
    function makeReview(booking) {
      if (!booking.review_rating) return '';
      return `
        <div class="card-review">
          <p><b>Отзыв:</b> <span class="stars">${'★'.repeat(booking.review_rating)}</span></p>
          <p>${safe(booking.review_text)}</p>
        </div>`;
    }

    // Кнопки смены статуса. У завершённой заявки их нет
    function makeButtons(booking) {
      if (booking.status === 'Завершено') return '';

      let buttons = '';
      if (booking.status === 'Новая') {
        buttons += `<button class="btn" onclick="setStatus(${booking.id}, 'Мероприятие назначено')">Назначить мероприятие</button>`;
      }
      buttons += `<button class="btn btn-green" onclick="setStatus(${booking.id}, 'Завершено')">Завершить</button>`;
      return `<div class="card-buttons">${buttons}</div>`;
    }

    // Меняет статус заявки и обновляет список
    async function setStatus(bookingId, status) {
      const result = await api('POST', '/api/admin/bookings/' + bookingId + '/status', { status: status });

      if (result.ok) {
        showMessage('Заявка № ' + bookingId + ': статус изменён на «' + status + '»');
      } else {
        showMessage(result.error);
      }
      loadBookings();
    }

    loadRooms();
    loadBookings();
  </script>
</body>
</html>
